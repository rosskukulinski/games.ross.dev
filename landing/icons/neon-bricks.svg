<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark background -->
  <rect width="100" height="100" fill="#080614" rx="12"/>
  <!-- Subtle grid -->
  <line x1="0" y1="30" x2="100" y2="30" stroke="#1c1440" stroke-width="1"/>
  <line x1="0" y1="60" x2="100" y2="60" stroke="#1c1440" stroke-width="1"/>
  <line x1="33" y1="0" x2="33" y2="100" stroke="#1c1440" stroke-width="1"/>
  <line x1="66" y1="0" x2="66" y2="100" stroke="#1c1440" stroke-width="1"/>
  <!-- Neon bricks rows -->
  <rect x="12" y="14" width="22" height="9" rx="2" fill="#ff2d78"/>
  <rect x="39" y="14" width="22" height="9" rx="2" fill="#ff2d78" opacity="0.85"/>
  <rect x="66" y="14" width="22" height="9" rx="2" fill="#ff2d78"/>
  <rect x="12" y="27" width="22" height="9" rx="2" fill="#ffb02d"/>
  <rect x="39" y="27" width="22" height="9" rx="2" fill="#ffb02d" opacity="0.85"/>
  <rect x="66" y="27" width="22" height="9" rx="2" fill="#ffb02d"/>
  <rect x="12" y="40" width="22" height="9" rx="2" fill="#3bf273"/>
  <rect x="66" y="40" width="22" height="9" rx="2" fill="#3bf273"/>
  <!-- Shattered brick particles -->
  <rect x="42" y="40" width="5" height="4" fill="#3bf273" transform="rotate(20 44 42)"/>
  <rect x="52" y="44" width="4" height="3" fill="#3bf273" transform="rotate(-30 54 45)" opacity="0.8"/>
  <rect x="47" y="36" width="3" height="3" fill="#aef" opacity="0.9"/>
  <!-- Ball with trail -->
  <circle cx="50" cy="62" r="4.5" fill="#40e8ff"/>
  <circle cx="50" cy="62" r="2.2" fill="#ffffff"/>
  <circle cx="45" cy="69" r="3" fill="#40e8ff" opacity="0.45"/>
  <circle cx="41" cy="75" r="2" fill="#40e8ff" opacity="0.25"/>
  <!-- Paddle -->
  <rect x="32" y="84" width="36" height="7" rx="3.5" fill="#b44dff"/>
  <rect x="36" y="86" width="28" height="3" rx="1.5" fill="#e0b3ff"/>
  <!-- Glow accents -->
  <circle cx="50" cy="62" r="7.5" fill="none" stroke="#40e8ff" stroke-width="1.2" opacity="0.35"/>
</svg>
