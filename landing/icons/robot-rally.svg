<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sky background -->
  <rect width="100" height="100" fill="#8fd3ff" rx="12"/>
  <!-- Sun -->
  <circle cx="80" cy="18" r="8" fill="#ffe27a"/>
  <!-- Cloud -->
  <ellipse cx="24" cy="20" rx="10" ry="5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="32" cy="23" rx="7" ry="4" fill="#ffffff" opacity="0.9"/>
  <!-- Floating island -->
  <ellipse cx="50" cy="82" rx="34" ry="10" fill="#7a4a2b"/>
  <ellipse cx="50" cy="78" rx="34" ry="10" fill="#57c94f"/>
  <!-- Tree -->
  <rect x="16" y="60" width="4" height="10" fill="#7a4a2b" rx="1"/>
  <circle cx="18" cy="56" r="7" fill="#3da33a"/>
  <!-- Robot body -->
  <rect x="42" y="46" width="16" height="16" rx="4" fill="#e8ecf2"/>
  <!-- Robot head -->
  <rect x="41" y="30" width="18" height="14" rx="5" fill="#f4f7fb"/>
  <rect x="44" y="34" width="12" height="6" rx="3" fill="#22334d"/>
  <circle cx="47.5" cy="37" r="1.8" fill="#40e8ff"/>
  <circle cx="52.5" cy="37" r="1.8" fill="#40e8ff"/>
  <!-- Antenna -->
  <line x1="50" y1="30" x2="50" y2="25" stroke="#9aa7b8" stroke-width="2"/>
  <circle cx="50" cy="24" r="2" fill="#ff5f5f"/>
  <!-- Arms -->
  <rect x="36" y="48" width="5" height="10" rx="2.5" fill="#c3ccd9" transform="rotate(15 38 53)"/>
  <rect x="59" y="46" width="5" height="10" rx="2.5" fill="#c3ccd9" transform="rotate(-35 61 51)"/>
  <!-- Legs -->
  <rect x="44" y="62" width="5" height="9" rx="2.5" fill="#c3ccd9"/>
  <rect x="51" y="62" width="5" height="9" rx="2.5" fill="#c3ccd9"/>
  <!-- Glowing orb pickup -->
  <circle cx="74" cy="58" r="6" fill="#ffd93b"/>
  <circle cx="74" cy="58" r="3" fill="#fff3b8"/>
  <circle cx="74" cy="58" r="9" fill="none" stroke="#ffd93b" stroke-width="1.5" opacity="0.5"/>
  <!-- Sparkles -->
  <polygon points="30,42 31,45 34,45 31.8,46.8 32.6,50 30,48 27.4,50 28.2,46.8 26,45 29,45" fill="#ffffff" opacity="0.9"/>
</svg>
