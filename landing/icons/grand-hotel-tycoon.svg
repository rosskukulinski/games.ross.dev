<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sky -->
  <rect width="100" height="100" fill="#7FD4F5" rx="12"/>
  <!-- Sea along the top -->
  <path d="M0 12 A12 12 0 0 1 12 0 H88 A12 12 0 0 1 100 12 V34 H0 Z" fill="#3FB4E8"/>
  <path d="M6 14 q7 -3 14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#8FDCEC" stroke-width="2" stroke-linecap="round"/>
  <path d="M2 25 q7 -3 14 0 t14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#8FDCEC" stroke-width="2" stroke-linecap="round"/>
  <!-- Island: beach ring, then lawn -->
  <ellipse cx="50" cy="80" rx="64" ry="46" fill="#F0DFB8"/>
  <ellipse cx="50" cy="85" rx="58" ry="43" fill="#6FBF5F"/>
  <!-- Promenade -->
  <path d="M0 66 H100 V75 H0 Z" fill="#E8D3A4"/>
  <path d="M0 66 H100" stroke="#CDB384" stroke-width="1.5"/>

  <!-- Swimming pool -->
  <rect x="56" y="55" width="36" height="17" rx="4" fill="#FFFBF3"/>
  <rect x="59" y="58" width="30" height="11" rx="3" fill="#2FC3E3"/>
  <path d="M62 63 q4 -2 8 0 t8 0 t8 0" fill="none" stroke="#8FEAFA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Water slide: tower + candy-striped flume into the pool -->
  <rect x="76" y="30" width="8" height="28" rx="1.5" fill="#FFE6C9"/>
  <rect x="73" y="27" width="14" height="4" rx="1.5" fill="#E8734A"/>
  <path d="M74 32 C 62 34, 58 46, 66 52 C 71 55, 73 57, 72 60"
        fill="none" stroke="#FF5FA2" stroke-width="7" stroke-linecap="round"/>
  <path d="M74 32 C 62 34, 58 46, 66 52 C 71 55, 73 57, 72 60"
        fill="none" stroke="#FFE27A" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="3 6"/>

  <!-- Hotel block -->
  <rect x="9" y="42" width="36" height="26" rx="2" fill="#FFF3E0"/>
  <polygon points="5,43 27,29 49,43" fill="#E8734A"/>
  <polygon points="5,43 27,29 49,43" fill="none" stroke="#C4552F" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Sign band -->
  <rect x="12" y="45" width="30" height="6" rx="2.5" fill="#E8734A"/>
  <circle cx="17" cy="48" r="1.2" fill="#FFD93B"/>
  <circle cx="23" cy="48" r="1.2" fill="#FFD93B"/>
  <circle cx="29" cy="48" r="1.2" fill="#FFD93B"/>
  <circle cx="35" cy="48" r="1.2" fill="#FFD93B"/>
  <!-- Windows and door -->
  <rect x="13" y="54" width="8" height="8" rx="1.5" fill="#FFC94A" stroke="#FFFBF3" stroke-width="1.5"/>
  <rect x="33" y="54" width="8" height="8" rx="1.5" fill="#FFC94A" stroke="#FFFBF3" stroke-width="1.5"/>
  <rect x="23" y="55" width="9" height="13" rx="1.5" fill="#5B8FA8" stroke="#FFFBF3" stroke-width="1.5"/>

  <!-- Palm tree -->
  <path d="M52 68 q1.5 -8 0.5 -14" stroke="#8A6242" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52.5 53 q-7 -3 -9 2" stroke="#5FAE50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52.5 53 q7 -3 9 2" stroke="#3D7A36" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52.5 53 q-3 -6 -8 -6" stroke="#5FAE50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52.5 53 q3 -6 8 -6" stroke="#3D7A36" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- The queue of guests waiting to check in -->
  <g>
    <circle cx="12" cy="79" r="3" fill="#F3C6A0"/>
    <path d="M9 90 q0 -6 3 -6 q3 0 3 6 Z" fill="#F26D8B"/>
    <circle cx="22" cy="79" r="3" fill="#C98D63"/>
    <path d="M19 90 q0 -6 3 -6 q3 0 3 6 Z" fill="#6FA8FF"/>
    <circle cx="32" cy="79" r="3" fill="#F3C6A0"/>
    <path d="M29 90 q0 -6 3 -6 q3 0 3 6 Z" fill="#48C9A0"/>
  </g>

  <!-- Coin the player is here to collect -->
  <circle cx="86" cy="86" r="9" fill="#E0A01E"/>
  <circle cx="86" cy="85" r="8" fill="#FFC94A"/>
  <circle cx="83.5" cy="82.5" r="2.4" fill="#FFF0B8"/>
  <path d="M86 80 v10 M83.5 82 h5 M83.5 88 h5" stroke="#B87C10" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Star rating badge -->
  <polygon points="88,10 90.4,15.2 96,16 92,20 93,25.8 88,23 83,25.8 84,20 80,16 85.6,15.2" fill="#FFD93B"/>
</svg>
