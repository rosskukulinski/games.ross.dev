<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hiGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a54"/>
      <stop offset="100%" stop-color="#122a40"/>
    </linearGradient>
    <radialGradient id="hiVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#02040c"/>
      <stop offset="72%" stop-color="#02040c"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </radialGradient>
    <radialGradient id="hiVoid2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#02040c"/>
      <stop offset="78%" stop-color="#04070f"/>
      <stop offset="100%" stop-color="#12283c"/>
    </radialGradient>
    <radialGradient id="hiTree" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#5fd077"/>
      <stop offset="100%" stop-color="#2b8a3e"/>
    </radialGradient>
    <filter id="hiGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="18" fill="url(#hiGround)"/>

  <!-- faint park paths -->
  <g stroke="#2c5578" stroke-width="1.4" opacity="0.5">
    <line x1="10" y1="36" x2="90" y2="36"/>
    <line x1="64" y1="8" x2="64" y2="92"/>
  </g>

  <!-- scattered snacks -->
  <g>
    <circle cx="18" cy="20" r="3.2" fill="#ff8fab"/>
    <circle cx="18" cy="20" r="1.4" fill="#ffd166"/>
    <circle cx="84" cy="72" r="3" fill="#ff8fab"/>
    <circle cx="84" cy="72" r="1.3" fill="#ffd166"/>
    <rect x="72" y="14" width="9" height="15" rx="2.6" fill="#4dabf7"/>
    <rect x="73.6" y="17" width="5.8" height="3.4" rx="1.4" fill="#a5d8ff"/>
    <circle cx="26" cy="80" r="5.4" fill="#ff7b00"/>
    <circle cx="26" cy="80" r="3.4" fill="#fff4e6"/>
    <circle cx="26" cy="80" r="1.8" fill="#ff9500"/>
  </g>

  <!-- rival hole (small, coral) -->
  <g filter="url(#hiGlow)">
    <circle cx="76" cy="48" r="9.5" fill="none" stroke="#ff5d73" stroke-width="1.8"/>
  </g>
  <circle cx="76" cy="48" r="9" fill="url(#hiVoid2)"/>

  <!-- the player's hole, mid-meal -->
  <g filter="url(#hiGlow)">
    <circle cx="40" cy="52" r="21.5" fill="none" stroke="#3fe8ff" stroke-width="2.6"/>
  </g>
  <circle cx="40" cy="52" r="20.5" fill="url(#hiVoid)"/>

  <!-- a tree tipping into the void -->
  <g transform="rotate(-34 47 41)">
    <circle cx="47" cy="41" r="8.6" fill="url(#hiTree)"/>
    <circle cx="45" cy="39" r="3.4" fill="#74e08c" opacity="0.7"/>
    <circle cx="47" cy="41" r="1.8" fill="#8d5524"/>
  </g>

  <!-- swirl inside the hole -->
  <path d="M34 52 a7 7 0 0 1 12 -4" fill="none" stroke="#1e5f7a" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M46 56 a7 6 0 0 1 -10 2" fill="none" stroke="#1e5f7a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
</svg>
