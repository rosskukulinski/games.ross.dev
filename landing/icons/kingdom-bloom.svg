<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#8f7fd8"/>
  <defs>
    <radialGradient id="kbSky" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#c3b3ee"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </radialGradient>
    <linearGradient id="kbGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93da7e"/>
      <stop offset="100%" stop-color="#58b368"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#kbSky)"/>

  <!-- Sunstone -->
  <circle cx="50" cy="20" r="9" fill="#ffde7a" stroke="#f6b73c" stroke-width="2"/>
  <g stroke="#ffd75e" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="5" x2="50" y2="9"/>
    <line x1="61" y1="9" x2="58.5" y2="12"/>
    <line x1="65" y1="20" x2="61" y2="20"/>
    <line x1="39" y1="9" x2="41.5" y2="12"/>
    <line x1="35" y1="20" x2="39" y2="20"/>
  </g>

  <!-- Grass -->
  <ellipse cx="50" cy="92" rx="58" ry="22" fill="url(#kbGrass)"/>

  <!-- Castle -->
  <rect x="28" y="48" width="44" height="34" rx="2" fill="#efe6f8"/>
  <rect x="20" y="40" width="14" height="42" rx="2" fill="#e0d4f2"/>
  <rect x="66" y="40" width="14" height="42" rx="2" fill="#e0d4f2"/>
  <polygon points="18,41 36,41 27,28" fill="#6c5ce7"/>
  <polygon points="64,41 82,41 73,28" fill="#6c5ce7"/>
  <rect x="30" y="44" width="8" height="6" fill="#efe6f8"/>
  <rect x="46" y="44" width="8" height="6" fill="#efe6f8"/>
  <rect x="62" y="44" width="8" height="6" fill="#efe6f8"/>
  <path d="M43 82 v-12 a7 7 0 0 1 14 0 v12 z" fill="#8a5a33"/>
  <path d="M43 82 v-12 a7 7 0 0 1 14 0 v12" fill="none" stroke="#f6c453" stroke-width="2"/>
  <rect x="24" y="52" width="6" height="8" rx="2.5" fill="#6f5fb0"/>
  <rect x="70" y="52" width="6" height="8" rx="2.5" fill="#6f5fb0"/>

  <!-- Flag -->
  <line x1="50" y1="34" x2="50" y2="48" stroke="#7c4f27" stroke-width="2"/>
  <polygon points="50,34 50,41 60,37.5" fill="#ff5d73"/>

  <!-- Flowers -->
  <g>
    <line x1="14" y1="92" x2="14" y2="86" stroke="#3e8e41" stroke-width="1.6"/>
    <circle cx="14" cy="84" r="3.2" fill="#ff6b9d"/>
    <circle cx="14" cy="84" r="1.2" fill="#fff7d6"/>
    <line x1="86" y1="92" x2="86" y2="86" stroke="#3e8e41" stroke-width="1.6"/>
    <circle cx="86" cy="84" r="3.2" fill="#ffd166"/>
    <circle cx="86" cy="84" r="1.2" fill="#fff7d6"/>
    <line x1="24" y1="96" x2="24" y2="90" stroke="#3e8e41" stroke-width="1.6"/>
    <circle cx="24" cy="88" r="3.2" fill="#c77dff"/>
    <circle cx="24" cy="88" r="1.2" fill="#fff7d6"/>
    <line x1="76" y1="96" x2="76" y2="90" stroke="#3e8e41" stroke-width="1.6"/>
    <circle cx="76" cy="88" r="3.2" fill="#63c3f0"/>
    <circle cx="76" cy="88" r="1.2" fill="#fff7d6"/>
  </g>

  <!-- Sparkles -->
  <text x="18" y="24" font-size="9" fill="#fff" opacity="0.9">✦</text>
  <text x="76" y="18" font-size="7" fill="#fff" opacity="0.8">✦</text>
</svg>
