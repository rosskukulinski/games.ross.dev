<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7de0"/>
      <stop offset="100%" stop-color="#9fe0ff"/>
    </linearGradient>
    <linearGradient id="rkGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd457"/>
      <stop offset="100%" stop-color="#4fb646"/>
    </linearGradient>
    <linearGradient id="rkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e0262f"/>
    </linearGradient>
    <linearGradient id="rkFlame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd23b"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="rkClip"><rect width="100" height="100" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#rkClip)">
    <!-- sky, hills, grass -->
    <rect width="100" height="100" fill="url(#rkSky)"/>
    <ellipse cx="22" cy="46" rx="30" ry="10" fill="#7cc7ff" opacity="0.8"/>
    <ellipse cx="80" cy="47" rx="34" ry="11" fill="#7cc7ff" opacity="0.8"/>
    <ellipse cx="30" cy="20" rx="12" ry="5" fill="#fff" opacity="0.85"/>
    <ellipse cx="38" cy="18" rx="8" ry="4.5" fill="#fff" opacity="0.85"/>
    <rect y="46" width="100" height="54" fill="url(#rkGrass)"/>
    <!-- trees -->
    <polygon points="8,46 12,32 16,46" fill="#2f9e4f"/>
    <polygon points="86,46 91,30 96,46" fill="#2f9e4f"/>
    <!-- road with curbs -->
    <path d="M-10 100 L34 47 L66 47 L110 100 Z" fill="#4c5068"/>
    <path d="M-10 100 L34 47 L38 47 L-2 100 Z" fill="#e5383f"/>
    <path d="M-2 100 L38 47 L40 47 L2 100 Z" fill="#f7f5ee"/>
    <path d="M110 100 L66 47 L62 47 L102 100 Z" fill="#e5383f"/>
    <path d="M102 100 L62 47 L60 47 L98 100 Z" fill="#f7f5ee"/>
    <g fill="#f4f1e6">
      <rect x="49" y="52" width="2" height="6" rx="1"/>
      <rect x="49" y="64" width="2" height="9" rx="1"/>
      <rect x="49" y="80" width="2" height="14" rx="1"/>
    </g>
    <!-- boost flames behind the kart -->
    <path d="M36 88 L20 96 L38 92 Z" fill="url(#rkFlame)" transform="rotate(-8 36 90)"/>
    <path d="M62 88 L80 98 L64 92 Z" fill="url(#rkFlame)" transform="rotate(8 62 90)"/>
    <!-- kart: rear three-quarter view -->
    <ellipse cx="50" cy="90" rx="22" ry="5" fill="#000" opacity="0.28"/>
    <rect x="27" y="76" width="9" height="13" rx="3" fill="#1a1826"/>
    <rect x="64" y="76" width="9" height="13" rx="3" fill="#1a1826"/>
    <rect x="29" y="78" width="5" height="9" rx="2" fill="#d8d8e6"/>
    <rect x="66" y="78" width="5" height="9" rx="2" fill="#d8d8e6"/>
    <rect x="31" y="64" width="38" height="22" rx="6" fill="url(#rkBody)"/>
    <rect x="34" y="60" width="32" height="4" rx="2" fill="#2b2440"/>
    <rect x="26" y="57" width="48" height="5" rx="2.5" fill="#ffd23b"/>
    <rect x="40" y="76" width="20" height="6" rx="2" fill="#2b2440"/>
    <circle cx="50" cy="63" r="7.5" fill="#ffd9b3"/>
    <path d="M42.5 63 A7.5 7.5 0 0 1 57.5 63 Z" fill="#e0262f"/>
    <rect x="49" y="52" width="2" height="6" rx="1" fill="#ffd23b"/>
    <rect x="42" y="84" width="4" height="5" rx="1" fill="#7a7690"/>
    <rect x="54" y="84" width="4" height="5" rx="1" fill="#7a7690"/>
    <!-- exhaust glow -->
    <circle cx="44" cy="90" r="3" fill="#ffb347" opacity="0.9"/>
    <circle cx="56" cy="90" r="3" fill="#ffb347" opacity="0.9"/>
  </g>
</svg>
