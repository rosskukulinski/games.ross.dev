<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#060213" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='20' cy='12' r='7' fill='%2337f2ff'/%3E%3Cpath d='M2 30 L14 16 L18 20 Z' fill='%23ff3fd8'/%3E%3C/svg%3E" />
  <title>Comet Dash</title>
  <!-- #hud holds the top-left corner and #mute the top-right, so the arcade's
       back button (injected at build time) takes a free one. -->
  <meta name="arcade-home-button" content="bottom-left" />
  <style>
    :root {
      --cyan: #37f2ff;
      --magenta: #ff3fd8;
      --orange: #ffab3c;
      --violet: #8a6bff;
      --ink: #060213;
      --panel: rgba(14, 10, 42, 0.55);
      --panel-border: rgba(122, 108, 255, 0.35);
      --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: var(--font);
      color: #eef0ff;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }
    /* soft CSS vignette on top of the 3D view */
    #vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(3, 0, 14, 0.55) 100%);
      z-index: 2;
    }

    /* ------- HUD ------- */
    #hud {
      position: absolute; top: 18px; left: 18px; z-index: 5;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .hud-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px 20px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 0 24px rgba(90, 70, 255, 0.08);
      min-width: 190px;
    }
    #score {
      font-size: 40px; font-weight: 800; letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(55, 242, 255, 0.65);
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    #best {
      margin-top: 2px;
      font-size: 13px; font-weight: 700; letter-spacing: 2px;
      color: var(--violet);
      text-shadow: 0 0 10px rgba(138, 107, 255, 0.6);
      font-variant-numeric: tabular-nums;
    }
    #speed-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    #speed-wrap {
      flex: 1; height: 7px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }
    #speed-bar {
      height: 100%; width: 10%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--orange));
      box-shadow: 0 0 12px rgba(255, 63, 216, 0.8);
      transition: width 0.25s ease-out;
    }
    #speed-label {
      font-size: 12px; font-weight: 800; letter-spacing: 1px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(55, 242, 255, 0.7);
      font-variant-numeric: tabular-nums;
      min-width: 44px; text-align: right;
    }

    #mute {
      position: absolute; top: 18px; right: 18px; z-index: 6;
      width: 64px; height: 64px;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #eef0ff; font-size: 28px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }
    #mute:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(55, 242, 255, 0.35); }
    #mute:active { transform: scale(0.94); }

    /* ------- Screens ------- */
    .screen {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 38%, rgba(20, 8, 60, 0.42), rgba(3, 0, 14, 0.78) 78%);
      opacity: 1;
      transition: opacity 0.5s ease, visibility 0s;
      padding: 24px;
    }
    .screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.5s ease, visibility 0s 0.5s; }
    #hud.hidden { opacity: 0; }

    .title {
      font-size: clamp(46px, 9vw, 96px);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(100deg, var(--cyan) 5%, var(--violet) 40%, var(--magenta) 70%, var(--orange) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 26px rgba(120, 80, 255, 0.55));
      line-height: 1;
    }
    .subtitle {
      margin-top: 10px;
      font-size: clamp(14px, 2.4vw, 19px);
      font-weight: 600;
      color: #b9c1ff;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(90, 70, 255, 0.5);
    }
    .prompt {
      margin-top: 40px;
      font-size: clamp(16px, 2.6vw, 22px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(55, 242, 255, 0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.985); }
    }

    /* icon-only how-to-play: three tap zones, then what's good / bad */
    .howto {
      margin-top: 30px;
      display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
    }
    .howto-card {
      width: 112px; height: 112px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 0 24px rgba(90, 70, 255, 0.08);
    }
    .howto-card svg { width: 58px; height: 58px; overflow: visible; }
    .howto-card .tag {
      font-size: 15px; font-weight: 900; letter-spacing: 1px;
      color: #dfe4ff;
    }
    .howto-card.good { border-color: rgba(255, 213, 74, 0.55); }
    .howto-card.bad { border-color: rgba(255, 143, 60, 0.55); }
    .howto-card.hop { border-color: rgba(255, 63, 216, 0.55); }
    .keys {
      margin-top: 18px;
      display: flex; gap: 10px; justify-content: center; align-items: center;
      font-size: 14px; font-weight: 800; color: #9aa3e6; letter-spacing: 1px;
    }
    .keycap {
      min-width: 36px; padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(55, 242, 255, 0.6);
    }

    .big-btn {
      margin-top: 30px;
      width: 132px; height: 132px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.85);
      background: radial-gradient(circle at 38% 32%, #6ff7ff 0%, #2bb8ff 35%, #7a4dff 75%, #ff3fd8 100%);
      box-shadow: 0 0 40px rgba(55, 242, 255, 0.6), 0 0 90px rgba(255, 63, 216, 0.35), inset 0 -8px 20px rgba(20, 0, 60, 0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      animation: bob 1.4s ease-in-out infinite;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .big-btn svg { width: 60px; height: 60px; filter: drop-shadow(0 2px 6px rgba(20, 0, 60, 0.5)); }
    .big-btn:active { transform: scale(0.93); }
    @keyframes bob {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    #restart:not(.ready) {
      opacity: 0.3; filter: grayscale(0.8);
      animation: none; transform: scale(0.86);
      cursor: default;
    }
    #restart.ready { animation: pop-in 0.35s cubic-bezier(.2, 1.6, .5, 1), bob 1.4s 0.35s ease-in-out infinite; }
    @keyframes pop-in {
      from { transform: scale(0.6); }
      to { transform: scale(1); }
    }
    .prompt.small { margin-top: 16px; font-size: clamp(13px, 2vw, 16px); opacity: 0.75; }

    /* phones and short screens: keep the cards 3-across and the play
       button on-screen */
    @media (max-width: 500px), (max-height: 700px) {
      .screen { padding: 12px; }
      .title { font-size: clamp(36px, 10vw, 64px); letter-spacing: 2px; }
      .subtitle { margin-top: 6px; font-size: 13px; letter-spacing: 2px; }
      .howto { margin-top: 18px; gap: 10px; flex-wrap: nowrap; }
      .howto-card { width: min(88px, 26vw); height: min(88px, 26vw); border-radius: 18px; gap: 3px; }
      .howto-card svg { width: 44px; height: 44px; }
      .howto-card .tag { font-size: 13px; }
      .big-btn { margin-top: 20px; width: 104px; height: 104px; flex-shrink: 0; }
      .big-btn svg { width: 48px; height: 48px; }
      .keys { margin-top: 12px; }
      #go-score { margin-top: 14px; }
    }
    @media (max-height: 520px) {
      .subtitle, .keys { display: none; }
      .howto { margin-top: 10px; }
      .howto + .howto { margin-top: 8px !important; }
      .howto-card { width: 70px; height: 70px; }
      .howto-card svg { width: 36px; height: 36px; }
      .big-btn { margin-top: 12px; width: 88px; height: 88px; }
    }

    /* ------- tap zones (during play) ------- */
    #zones {
      position: absolute; inset: 0; z-index: 3;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #zones.hidden { opacity: 0; }
    .zone {
      position: absolute; top: 0; bottom: 0; width: 33.333%;
      display: flex; align-items: center;
      opacity: 0.32;
    }
    #zone-left { left: 0; justify-content: flex-start; padding-left: 14px;
      background: linear-gradient(90deg, rgba(55, 242, 255, 0.10), transparent 40%); }
    #zone-right { right: 0; justify-content: flex-end; padding-right: 14px;
      background: linear-gradient(270deg, rgba(55, 242, 255, 0.10), transparent 40%); }
    #zone-jump { left: 33.333%; align-items: flex-end; justify-content: center; padding-bottom: 22px;
      background: linear-gradient(0deg, rgba(255, 63, 216, 0.10), transparent 30%); }
    .zone svg { width: 64px; height: 64px; filter: drop-shadow(0 0 10px rgba(55, 242, 255, 0.9)); }
    #zone-jump svg { filter: drop-shadow(0 0 10px rgba(255, 63, 216, 0.9)); }
    .zone.hit { animation: zone-hit 0.35s ease-out; }
    @keyframes zone-hit {
      0% { opacity: 0.95; }
      100% { opacity: 0.32; }
    }
    .ripple {
      position: fixed; z-index: 4;
      width: 90px; height: 90px; margin: -45px 0 0 -45px;
      border-radius: 50%;
      border: 4px solid var(--cyan);
      box-shadow: 0 0 22px rgba(55, 242, 255, 0.8);
      pointer-events: none;
      animation: ripple 0.45s ease-out forwards;
    }
    .ripple-jump { border-color: var(--magenta); box-shadow: 0 0 22px rgba(255, 63, 216, 0.8); }
    @keyframes ripple {
      from { transform: scale(0.3); opacity: 1; }
      to { transform: scale(1.4); opacity: 0; }
    }

    #go-title {
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(100deg, var(--orange), var(--magenta));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 24px rgba(255, 63, 120, 0.55));
    }
    #go-score {
      margin-top: 22px;
      font-size: clamp(44px, 8vw, 84px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 26px rgba(55, 242, 255, 0.75);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #go-best {
      margin-top: 10px;
      font-size: clamp(14px, 2.4vw, 20px);
      font-weight: 700; letter-spacing: 3px;
      color: var(--violet);
      text-shadow: 0 0 12px rgba(138, 107, 255, 0.6);
    }
    #go-newbest {
      margin-top: 14px;
      display: inline-block;
      padding: 8px 22px;
      border-radius: 99px;
      font-size: 15px; font-weight: 900; letter-spacing: 3px;
      color: #12042a;
      background: linear-gradient(90deg, var(--orange), var(--magenta));
      box-shadow: 0 0 26px rgba(255, 63, 216, 0.7);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #go-newbest.hidden { display: none; }

    #paused-banner {
      position: absolute; top: 50%; left: 50%; z-index: 9;
      transform: translate(-50%, -50%);
      padding: 14px 34px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 20px; font-weight: 800; letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(55, 242, 255, 0.7);
    }
    #paused-banner.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-panel">
      <div id="score">0</div>
      <div id="best">BEST 0</div>
      <div id="speed-row">
        <div id="speed-wrap"><div id="speed-bar"></div></div>
        <div id="speed-label">&times;1.0</div>
      </div>
    </div>
  </div>

  <!-- tap-zone hints: left third / right third steer, middle jumps -->
  <div id="zones" class="hidden">
    <div class="zone" id="zone-left"><svg viewBox="0 0 60 60"><path d="M36 12 L18 30 L36 48" fill="none" stroke="#37f2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="zone" id="zone-jump"><svg viewBox="0 0 60 60"><path d="M12 40 L30 20 L48 40" fill="none" stroke="#ff3fd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="zone" id="zone-right"><svg viewBox="0 0 60 60"><path d="M24 12 L42 30 L24 48" fill="none" stroke="#37f2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <button id="mute" aria-label="Toggle sound">&#128266;</button>
  <div id="paused-banner" class="hidden">PAUSED</div>

  <div id="start-screen" class="screen">
    <div class="title">COMET DASH</div>
    <div class="subtitle">Ride the neon skyway</div>
    <!-- How to play, in pictures: tap left / middle / right, grab stars,
         dodge pillars, hop the low gates. -->
    <div class="howto">
      <div class="howto-card" aria-label="Tap left side to move left">
        <svg viewBox="0 0 60 60"><path d="M36 12 L18 30 L36 48" fill="none" stroke="#37f2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="howto-card" aria-label="Tap the middle to jump">
        <svg viewBox="0 0 60 60"><path d="M12 38 L30 18 L48 38" fill="none" stroke="#ff3fd8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 52 H46" stroke="#ff3fd8" stroke-width="5" stroke-linecap="round" opacity="0.5"/></svg>
      </div>
      <div class="howto-card" aria-label="Tap right side to move right">
        <svg viewBox="0 0 60 60"><path d="M24 12 L42 30 L24 48" fill="none" stroke="#37f2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="howto" style="margin-top:14px">
      <div class="howto-card good" aria-label="Grab stars">
        <svg viewBox="0 0 60 60"><path d="M30 6 L37 22 L54 23 L41 34 L45 51 L30 42 L15 51 L19 34 L6 23 L23 22 Z" fill="#ffd54a" stroke="#fff3b0" stroke-width="2" stroke-linejoin="round"/></svg>
        <div class="tag" style="color:#ffd54a">+50</div>
      </div>
      <div class="howto-card bad" aria-label="Go around pillars">
        <svg viewBox="0 0 60 60"><rect x="8" y="10" width="20" height="42" rx="3" fill="#120f2a" stroke="#ff8f3c" stroke-width="4"/><path d="M34 31 H52 M45 24 L52 31 L45 38" fill="none" stroke="#37f2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="howto-card hop" aria-label="Jump over low gates">
        <svg viewBox="0 0 60 60"><path d="M10 54 V40 M50 54 V40 M8 42 H52" stroke="#ff3fd8" stroke-width="5" stroke-linecap="round"/><path d="M8 34 Q30 0 52 34" fill="none" stroke="#37f2ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/></svg>
      </div>
    </div>
    <div class="big-btn" aria-label="Start">
      <svg viewBox="0 0 60 60"><path d="M20 12 L48 30 L20 48 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>
    </div>
    <div class="keys"><span class="keycap">&larr; &rarr;</span><span class="keycap">&uarr; / Space</span></div>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <div id="go-title">SHIP DOWN!</div>
    <div id="go-score">0</div>
    <div id="go-best">BEST 0</div>
    <div id="go-newbest" class="hidden">&#9733; NEW BEST! &#9733;</div>
    <button id="restart" class="big-btn" aria-label="Fly again" disabled>
      <svg viewBox="0 0 60 60"><path d="M45 30 A15 15 0 1 1 38 17" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M33 8 L44 15 L35 25 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script type="module" src="./src/main.ts"></script>
  <!-- Arcade leaderboard client, served from the site root. -->
  <script defer src="/arcade/arcade.js"></script>
</body>
</html>
