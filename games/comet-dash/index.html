<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#060213" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='20' cy='12' r='7' fill='%2337f2ff'/%3E%3Cpath d='M2 30 L14 16 L18 20 Z' fill='%23ff3fd8'/%3E%3C/svg%3E" />
  <title>Comet Dash</title>
  <!-- #hud holds the top-left corner and #mute the top-right, so the arcade's
       back button (injected at build time) takes a free one. -->
  <meta name="arcade-home-button" content="bottom-left" />
  <style>
    :root {
      --cyan: #37f2ff;
      --magenta: #ff3fd8;
      --orange: #ffab3c;
      --violet: #8a6bff;
      --ink: #060213;
      --panel: rgba(14, 10, 42, 0.55);
      --panel-border: rgba(122, 108, 255, 0.35);
      --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: var(--font);
      color: #eef0ff;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }
    /* soft CSS vignette on top of the 3D view */
    #vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(3, 0, 14, 0.55) 100%);
      z-index: 2;
    }

    /* ------- HUD ------- */
    #hud {
      position: absolute; top: 18px; left: 18px; z-index: 5;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .hud-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 12px 20px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 0 24px rgba(90, 70, 255, 0.08);
      min-width: 190px;
    }
    #score {
      font-size: 40px; font-weight: 800; letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(55, 242, 255, 0.65);
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    #best {
      margin-top: 2px;
      font-size: 13px; font-weight: 700; letter-spacing: 2px;
      color: var(--violet);
      text-shadow: 0 0 10px rgba(138, 107, 255, 0.6);
      font-variant-numeric: tabular-nums;
    }
    #speed-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    #speed-wrap {
      flex: 1; height: 7px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }
    #speed-bar {
      height: 100%; width: 10%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--orange));
      box-shadow: 0 0 12px rgba(255, 63, 216, 0.8);
      transition: width 0.25s ease-out;
    }
    #speed-label {
      font-size: 12px; font-weight: 800; letter-spacing: 1px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(55, 242, 255, 0.7);
      font-variant-numeric: tabular-nums;
      min-width: 44px; text-align: right;
    }

    #mute {
      position: absolute; top: 18px; right: 18px; z-index: 6;
      width: 52px; height: 52px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #eef0ff; font-size: 22px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }
    #mute:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(55, 242, 255, 0.35); }
    #mute:active { transform: scale(0.94); }

    /* ------- Screens ------- */
    .screen {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 38%, rgba(20, 8, 60, 0.42), rgba(3, 0, 14, 0.78) 78%);
      opacity: 1;
      transition: opacity 0.5s ease;
      padding: 24px;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }
    #hud.hidden { opacity: 0; }

    .title {
      font-size: clamp(46px, 9vw, 96px);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(100deg, var(--cyan) 5%, var(--violet) 40%, var(--magenta) 70%, var(--orange) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 26px rgba(120, 80, 255, 0.55));
      line-height: 1;
    }
    .subtitle {
      margin-top: 10px;
      font-size: clamp(14px, 2.4vw, 19px);
      font-weight: 600;
      color: #b9c1ff;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(90, 70, 255, 0.5);
    }
    .controls {
      margin-top: 34px;
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
      max-width: 640px;
    }
    .ctrl {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 14px; font-weight: 700;
      color: #dfe4ff;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .ctrl b { color: var(--cyan); text-shadow: 0 0 8px rgba(55, 242, 255, 0.7); }
    .prompt {
      margin-top: 40px;
      font-size: clamp(16px, 2.6vw, 22px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(55, 242, 255, 0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.985); }
    }

    #go-title {
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(100deg, var(--orange), var(--magenta));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 24px rgba(255, 63, 120, 0.55));
    }
    #go-score {
      margin-top: 22px;
      font-size: clamp(44px, 8vw, 84px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 26px rgba(55, 242, 255, 0.75);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #go-best {
      margin-top: 10px;
      font-size: clamp(14px, 2.4vw, 20px);
      font-weight: 700; letter-spacing: 3px;
      color: var(--violet);
      text-shadow: 0 0 12px rgba(138, 107, 255, 0.6);
    }
    #go-newbest {
      margin-top: 14px;
      display: inline-block;
      padding: 8px 22px;
      border-radius: 99px;
      font-size: 15px; font-weight: 900; letter-spacing: 3px;
      color: #12042a;
      background: linear-gradient(90deg, var(--orange), var(--magenta));
      box-shadow: 0 0 26px rgba(255, 63, 216, 0.7);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #go-newbest.hidden { display: none; }

    #paused-banner {
      position: absolute; top: 50%; left: 50%; z-index: 9;
      transform: translate(-50%, -50%);
      padding: 14px 34px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 20px; font-weight: 800; letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(55, 242, 255, 0.7);
    }
    #paused-banner.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-panel">
      <div id="score">0</div>
      <div id="best">BEST 0</div>
      <div id="speed-row">
        <div id="speed-wrap"><div id="speed-bar"></div></div>
        <div id="speed-label">&times;1.0</div>
      </div>
    </div>
  </div>

  <button id="mute" aria-label="Toggle sound">&#128266;</button>
  <div id="paused-banner" class="hidden">PAUSED</div>

  <div id="start-screen" class="screen">
    <div class="title">COMET DASH</div>
    <div class="subtitle">Ride the neon skyway</div>
    <div class="controls">
      <div class="ctrl"><b>&larr; &rarr;</b> or <b>A / D</b> &mdash; change lanes</div>
      <div class="ctrl"><b>&uarr;</b> / <b>W</b> / <b>Space</b> &mdash; jump</div>
      <div class="ctrl"><b>Swipe</b> to steer &amp; jump on touch</div>
    </div>
    <div class="controls" style="margin-top:14px">
      <div class="ctrl" style="border-color: rgba(255,171,60,0.4)">Grab <b style="color:var(--orange)">stars</b> &middot; dodge <b style="color:var(--magenta)">barriers</b> &middot; jump the <b style="color:var(--cyan)">low gates</b></div>
    </div>
    <div class="prompt">TAP OR PRESS ANY KEY TO START</div>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <div id="go-title">SHIP DOWN!</div>
    <div id="go-score">0</div>
    <div id="go-best">BEST 0</div>
    <div id="go-newbest" class="hidden">NEW BEST!</div>
    <div class="prompt">TAP OR PRESS ANY KEY TO FLY AGAIN</div>
  </div>

  <script type="module" src="./src/main.ts"></script>
  <!-- Arcade leaderboard client, served from the site root. -->
  <script defer src="/arcade/arcade.js"></script>
</body>
</html>
