<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <!-- The HUD spans the top edge, so the arcade's back button (injected at
         build time) drops below it. -->
    <meta name="arcade-home-button" content="bottom-left" />
    <title>Hole Munchers</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142c40'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23030510'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2300e5ff' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Floating HUD, visible during play -->
    <div id="hud" class="hidden">
      <div class="hud-corner hud-top-left">
        <button id="btn-quit" class="chip" type="button" aria-label="Back to menu">‹ Menu</button>
        <button id="btn-mute" class="chip" type="button" aria-label="Toggle sound">🔊</button>
      </div>
      <div id="timer" class="timer">2:00</div>
      <ol id="board" aria-label="Leaderboard"></ol>
      <div id="me-chip" class="me-chip"></div>
      <button id="room-chip" class="chip chip-code hidden" type="button">Code</button>
    </div>

    <!-- Big centre messages: countdown, GO!, you got swallowed -->
    <div id="banner" class="hidden"></div>

    <!-- Touch joystick -->
    <div id="joystick" class="hidden" aria-hidden="true">
      <div id="joy-base"></div>
      <div id="joy-knob"></div>
    </div>

    <div id="overlay">
      <!-- Main menu -->
      <section class="screen" id="screen-menu">
        <h1 class="title">HOLE<span>MUNCHERS</span></h1>
        <p class="tagline">Eat the whole town. Then eat each other.</p>
        <input
          id="name-input"
          class="name-input"
          maxlength="12"
          autocomplete="off"
          spellcheck="false"
          placeholder="Your name"
          aria-label="Your name"
        />
        <div class="stack">
          <button class="btn btn-primary" id="btn-solo" type="button">
            <span class="btn-icon">🕳️</span> Play Solo
          </button>
          <button class="btn btn-secondary" id="btn-host" type="button">
            <span class="btn-icon">🌐</span> Play With Friends
          </button>
          <button class="btn btn-ghost" id="btn-join" type="button">
            <span class="btn-icon">🔑</span> Join With a Code
          </button>
        </div>
        <p class="hint" id="menu-best"></p>
        <p class="hint">
          Steer with your mouse, finger, or arrow keys. Swallow anything smaller than
          your hole — including other players.
        </p>
      </section>

      <!-- Joining: enter a code -->
      <section class="screen hidden" id="screen-join">
        <h2 class="heading">Enter the Code</h2>
        <div class="code-input">
          <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Code letter 1" />
          <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Code letter 2" />
          <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Code letter 3" />
          <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Code letter 4" />
        </div>
        <div class="stack">
          <button class="btn btn-primary" id="btn-join-go" type="button">Join Arena</button>
          <button class="btn btn-ghost" data-back="menu" type="button">Back</button>
        </div>
      </section>

      <!-- Connecting spinner -->
      <section class="screen hidden" id="screen-connecting">
        <div class="spinner" aria-hidden="true"></div>
        <p class="tagline" id="connecting-text">Connecting…</p>
        <button class="btn btn-ghost" data-back="menu" type="button">Cancel</button>
      </section>

      <!-- Something went wrong -->
      <section class="screen hidden" id="screen-error">
        <h2 class="heading">Hmm.</h2>
        <p class="tagline" id="error-text"></p>
        <div class="stack">
          <button class="btn btn-primary" id="btn-error-solo" type="button">Play Solo Instead</button>
          <button class="btn btn-ghost" data-back="menu" type="button">Back to Menu</button>
        </div>
      </section>

      <!-- Round over: standings -->
      <section class="screen hidden" id="screen-over">
        <h2 class="heading" id="over-heading">Round Over!</h2>
        <ol id="standings"></ol>
        <p class="tagline" id="over-status"></p>
        <div class="stack">
          <button class="btn btn-ghost" data-back="menu" type="button">Back to Menu</button>
        </div>
      </section>
    </div>

    <div id="toast" class="hidden"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
