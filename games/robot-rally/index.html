<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5ec8ff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='8' width='20' height='16' rx='4' fill='%23aab6c2'/%3E%3Ccircle cx='12' cy='15' r='3' fill='%2333e0ff'/%3E%3Ccircle cx='20' cy='15' r='3' fill='%2333e0ff'/%3E%3Crect x='14' y='2' width='4' height='6' rx='2' fill='%23aab6c2'/%3E%3C/svg%3E" />
  <title>Robot Rally</title>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="orb-counter" class="hud-pill">
        <span class="orb-ico"></span>
        <span id="orb-count">0&thinsp;/&thinsp;10</span>
      </div>
      <div id="best" class="hud-pill small">Best: --</div>
    </div>
    <div class="hud-center">
      <div id="timer" class="hud-pill">90</div>
    </div>
    <div class="hud-right">
      <button id="mute-btn" class="hud-pill btnish" aria-label="Toggle sound">
        <svg id="snd-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M14.5 8.5a4 4 0 010 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M16.8 6a7.5 7.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <svg id="snd-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M15 9l6 6M21 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="popups"></div>

  <!-- Touch controls -->
  <div id="touch-ui">
    <div id="joy-zone">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <button id="jump-btn" aria-label="Jump">JUMP</button>
  </div>

  <!-- Start screen -->
  <div id="start-screen" class="panel-wrap">
    <div class="panel">
      <h1 class="game-title"><span>Robot</span> <span class="t2">Rally</span></h1>
      <p class="tagline">Help the little robot gather every energy orb!</p>
      <div class="controls-grid">
        <div class="ctl"><span class="kbd">W A S D</span><span>run around</span></div>
        <div class="ctl"><span class="kbd">SPACE</span><span>jump</span></div>
        <div class="ctl"><span class="kbd">TOUCH</span><span>joystick + jump button</span></div>
        <div class="ctl"><span class="kbd">TIP</span><span>bounce on the mushrooms!</span></div>
      </div>
      <button id="play-btn" class="big-btn">PLAY</button>
      <div id="loading-note">warming up the robot&hellip;</div>
    </div>
  </div>

  <!-- Win / time-up screen -->
  <div id="end-screen" class="panel-wrap hidden">
    <div class="panel">
      <h1 id="end-title" class="game-title small-title">You Win!</h1>
      <p id="end-sub" class="tagline">All orbs collected!</p>
      <div id="end-stats"></div>
      <button id="again-btn" class="big-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <!-- Arcade leaderboard client, served from the site root. -->
  <script defer src="/arcade/arcade.js"></script>
</body>
</html>
