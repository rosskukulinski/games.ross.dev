<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Hunt - Number Line Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2d1f3d 0%, #1a472a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .score-display {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .target-display {
            font-size: 3rem;
            font-weight: bold;
            color: #6b21a8;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .target-monster {
            font-size: 3.2rem;
            display: inline-block;
            animation: monster-bob 1.6s ease-in-out infinite;
        }

        @keyframes monster-bob {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-6px) rotate(4deg); }
        }

        .target-label {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 6px;
        }

        /* The whole band is the tap zone: a near miss above or below the bar
           still counts, and taps past either end clamp to that end. */
        .number-line-container {
            position: relative;
            padding: 56px 0;
            margin-bottom: 16px;
            background: #f7f1fc;
            border: 2px dashed #e4d4f4;
            border-radius: 18px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .number-line-container.disabled {
            cursor: default;
            border-color: transparent;
        }

        .number-line-container.nudge {
            animation: nudge 0.5s ease-in-out;
        }

        @keyframes nudge {
            0%, 100% { transform: translateX(0); background: #f7f1fc; }
            20% { transform: translateX(-6px); background: #ecdcfa; }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); background: #ecdcfa; }
            80% { transform: translateX(4px); }
        }

        .number-line {
            position: relative;
            height: 16px;
            background: #ddd3e8;
            border-radius: 8px;
            margin: 0 50px;
        }

        .number-line-container:not(.disabled):hover .number-line {
            background: #cfc1de;
        }

        .tick {
            position: absolute;
            top: 50%;
            width: 2px;
            height: 26px;
            background: #b8a6cc;
            border-radius: 1px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .tick.minor {
            height: 16px;
            width: 1px;
            opacity: 0.6;
        }

        .tick.major {
            height: 32px;
            width: 3px;
            background: #9b84b5;
        }

        .tick-label {
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: bold;
            color: #9b84b5;
        }

        .gap-bar {
            position: absolute;
            top: 50%;
            height: 8px;
            transform: translateY(-50%);
            border-radius: 4px;
            pointer-events: none;
            display: none;
        }

        .gap-bar.miss { background: rgba(231, 76, 60, 0.55); }
        .gap-bar.hit { background: rgba(39, 174, 96, 0.55); }

        .tap-hint {
            position: absolute;
            left: 50%;
            top: 4px;
            font-size: 2.2rem;
            transform: translateX(-50%);
            pointer-events: none;
            animation: tap-bounce 1.2s ease-in-out infinite;
        }

        .number-line-container.disabled .tap-hint,
        .number-line-container.aiming .tap-hint {
            display: none;
        }

        @keyframes tap-bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, 12px); }
        }

        .endpoint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #333;
            font-size: 1.2rem;
        }

        .endpoint.left {
            left: 10px;
        }

        .endpoint.right {
            right: 10px;
        }

        .marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .marker::after {
            content: attr(data-value);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .marker.guess {
            background: #3498db;
            border: 3px solid #2980b9;
        }

        .marker.guess::after {
            color: #3498db;
            top: 30px;
        }

        /* While the finger is down the marker follows it, bigger and with no
           number, so it shows where the guess will land without giving it away. */
        .marker.guess.aiming {
            width: 34px;
            height: 34px;
            transition: none;
            background: rgba(52, 152, 219, 0.75);
            box-shadow: 0 0 0 8px rgba(52, 152, 219, 0.2);
        }

        .marker.actual {
            width: auto;
            height: auto;
            border-radius: 0;
            font-size: 2.4rem;
            line-height: 1;
            animation: monster-pop 0.5s ease-out;
        }

        .marker.actual::after {
            color: #6b21a8;
            top: -26px;
        }

        @keyframes monster-pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .feedback {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .feedback-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .feedback-message {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .feedback.success .feedback-icon {
            animation: celebrate 0.5s ease-in-out;
        }

        .feedback.success.perfect .feedback-icon {
            animation: celebrate-perfect 1s ease-in-out;
        }

        .feedback.success.perfect .feedback-message {
            font-size: 1.4rem;
            color: #f1c40f;
        }

        .feedback.success .feedback-message {
            color: #27ae60;
        }

        .feedback.fail .feedback-message {
            color: #e74c3c;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3) rotate(-10deg); }
            50% { transform: scale(1.5); }
            75% { transform: scale(1.3) rotate(10deg); }
        }

        @keyframes celebrate-perfect {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.5) rotate(-15deg); }
            20% { transform: scale(1.8) rotate(15deg); }
            30% { transform: scale(2) rotate(-10deg); }
            40% { transform: scale(2.2) rotate(10deg); }
            50% { transform: scale(2.5); }
            60% { transform: scale(2.2) rotate(-10deg); }
            70% { transform: scale(2) rotate(10deg); }
            80% { transform: scale(1.5) rotate(-5deg); }
            90% { transform: scale(1.2) rotate(5deg); }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 1.5s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(300px) rotate(720deg);
            }
        }

        .confetti-piece.perfect {
            width: 15px;
            height: 15px;
            animation: confetti-fall-perfect 2.5s ease-out forwards;
        }

        @keyframes confetti-fall-perfect {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(200px) rotate(540deg) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translateY(500px) rotate(1080deg) scale(0.5);
            }
        }

        .next-btn {
            background: #6b21a8;
            color: white;
            border: none;
            min-height: 72px;
            min-width: 280px;
            padding: 14px 36px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 32px;
            touch-action: manipulation;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            background: #581c87;
            transform: translateY(-2px);
        }

        .next-btn.visible {
            display: inline-block;
        }

        .summary {
            display: none;
        }

        .summary.visible {
            display: block;
        }

        .summary h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
        }

        .stat-value.correct {
            color: #27ae60;
        }

        .stat-value.incorrect {
            color: #e74c3c;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .perfect-stat {
            color: #f1c40f;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .perfect-stat .star {
            font-size: 1.4rem;
        }

        .summary-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .play-again-btn,
        .change-level-btn {
            background: #27ae60;
            color: white;
            border: none;
            min-height: 64px;
            padding: 14px 36px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .change-level-btn {
            background: #6b21a8;
        }

        .play-again-btn:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        .change-level-btn:hover {
            background: #581c87;
            transform: translateY(-2px);
        }

        .game-content {
            display: block;
        }

        .game-content.hidden {
            display: none;
        }

        .instructions {
            color: #6b21a8;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .level-select {
            display: block;
        }

        .level-select.hidden {
            display: none;
        }

        .level-select h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .level-select p {
            color: #666;
            margin-bottom: 30px;
        }

        .level-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .level-btn {
            background: #6b21a8;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .level-btn:hover {
            background: #581c87;
            transform: translateX(5px);
        }

        .level-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 72px;
            touch-action: manipulation;
        }

        .level-btn .level-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .level-btn .level-name {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .level-btn .level-desc {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Monster Hunt</h1>
        <div class="score-display" id="score-display" style="display: none;">
            Monster <span id="current-trial">1</span> of 20 | Caught: <span id="score">0</span>
        </div>

        <div class="level-select" id="level-select">
            <h2>Choose your level</h2>
            <p>How tricky should the monsters be?</p>
            <div class="level-buttons">
                <button class="level-btn" data-level="1">
                    <span class="level-icon" aria-hidden="true">🐣</span>
                    <div>
                        <div class="level-name">Level 1</div>
                        <div class="level-desc">Number line from 0 to 20</div>
                    </div>
                </button>
                <button class="level-btn" data-level="2">
                    <span class="level-icon" aria-hidden="true">🐸</span>
                    <div>
                        <div class="level-name">Level 2</div>
                        <div class="level-desc">Number line from 0 to 100</div>
                    </div>
                </button>
                <button class="level-btn" data-level="3">
                    <span class="level-icon" aria-hidden="true">🦖</span>
                    <div>
                        <div class="level-name">Level 3</div>
                        <div class="level-desc">Number line from 0 to 1000</div>
                    </div>
                </button>
                <button class="level-btn" data-level="4">
                    <span class="level-icon" aria-hidden="true">❓</span>
                    <div>
                        <div class="level-name">Level 4</div>
                        <div class="level-desc">Mystery range - 100 spaces, random endpoints!</div>
                    </div>
                </button>
            </div>
        </div>

        <div class="game-content hidden" id="game-content">
            <div class="target-label">The monster is hiding at:</div>
            <div class="target-display">
                <span class="target-monster" id="target-monster" aria-hidden="true">👾</span>
                <span id="target-number">50</span>
            </div>

            <div class="number-line-container" id="line-zone">
                <span class="tap-hint" aria-hidden="true">👇</span>
                <span class="endpoint left" id="endpoint-left">0</span>
                <div class="number-line" id="number-line">
                    <div id="ticks"></div>
                    <div class="gap-bar" id="gap-bar"></div>
                    <div class="marker guess" id="guess-marker" style="display: none;"></div>
                    <div class="marker actual" id="actual-marker" style="display: none;"></div>
                </div>
                <span class="endpoint right" id="endpoint-right">100</span>
            </div>

            <div class="feedback" id="feedback"></div>

            <button class="next-btn" id="next-btn">Next monster ➜</button>

            <p class="instructions" id="instructions">👆 Tap the line!</p>
        </div>

        <div class="summary" id="summary">
            <h2>Hunt Complete!</h2>
            <div class="summary-stats">
                <div class="stat">
                    <div class="stat-value correct" id="final-correct">0</div>
                    <div class="stat-label">Caught</div>
                </div>
                <div class="stat">
                    <div class="stat-value incorrect" id="final-incorrect">0</div>
                    <div class="stat-label">Escaped</div>
                </div>
            </div>
            <div class="perfect-stat" id="perfect-stat">
                <span class="star">&#11088;</span> <span id="final-perfect">0</span> perfect catches!
            </div>
            <div class="summary-buttons">
                <button class="play-again-btn" id="play-again-btn">🔁 Hunt again</button>
                <button class="change-level-btn" id="change-level-btn">🗺️ Levels</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_TRIALS = 20;

        let currentTrial = 1;
        let score = 0;
        let perfectScore = 0;
        let targetNumber = 0;
        let targetNumbers = [];
        let hasClicked = false;
        let rangeMin = 0;
        let rangeMax = 100;
        let accuracyMargin = 5;
        let currentLevel = 1;
        let aiming = false;
        let aimPointerId = null;

        const MONSTERS = ['👹', '👺', '👻', '👾', '🧟', '🐉'];
        let trialMonster = '👾';

        const numberLine = document.getElementById('number-line');
        const targetDisplay = document.getElementById('target-number');
        const guessMarker = document.getElementById('guess-marker');
        const actualMarker = document.getElementById('actual-marker');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const currentTrialDisplay = document.getElementById('current-trial');
        const scoreDisplay = document.getElementById('score');
        const scoreDisplayContainer = document.getElementById('score-display');
        const gameContent = document.getElementById('game-content');
        const summary = document.getElementById('summary');
        const finalCorrect = document.getElementById('final-correct');
        const finalIncorrect = document.getElementById('final-incorrect');
        const finalPerfect = document.getElementById('final-perfect');
        const perfectStat = document.getElementById('perfect-stat');
        const playAgainBtn = document.getElementById('play-again-btn');
        const instructions = document.getElementById('instructions');
        const levelSelect = document.getElementById('level-select');
        const endpointLeft = document.getElementById('endpoint-left');
        const endpointRight = document.getElementById('endpoint-right');
        const lineZone = document.getElementById('line-zone');
        const ticks = document.getElementById('ticks');
        const gapBar = document.getElementById('gap-bar');
        const targetMonster = document.getElementById('target-monster');
        const changeLevelBtn = document.getElementById('change-level-btn');

        function setLevel(level) {
            switch(level) {
                case 1:
                    rangeMin = 0;
                    rangeMax = 20;
                    accuracyMargin = 2;
                    numberLine.style.margin = '0 50px';
                    break;
                case 2:
                    rangeMin = 0;
                    rangeMax = 100;
                    accuracyMargin = 5;
                    numberLine.style.margin = '0 50px';
                    break;
                case 3:
                    rangeMin = 0;
                    rangeMax = 1000;
                    accuracyMargin = 50;
                    numberLine.style.margin = '0 65px';
                    break;
                case 4:
                    rangeMin = Math.floor(Math.random() * 451) + 50;
                    rangeMax = rangeMin + 100;
                    accuracyMargin = 5;
                    numberLine.style.margin = '0 55px';
                    break;
            }
            endpointLeft.textContent = rangeMin;
            endpointRight.textContent = rangeMax;
            drawTicks();
        }

        // Tick marks help judge distance. Only the middle gets a number:
        // halfway is a landmark, not the answer.
        function drawTicks() {
            ticks.innerHTML = '';
            const range = rangeMax - rangeMin;
            const step = range <= 20 ? 1 : range / 10;
            const count = Math.round(range / step);
            for (let i = 1; i < count; i++) {
                const tick = document.createElement('div');
                const isMid = i * 2 === count;
                const isMajor = range <= 20 && i % 5 === 0;
                tick.className = 'tick' + (isMid ? ' major' : isMajor ? '' : range <= 20 ? ' minor' : '');
                tick.style.left = (i / count) * 100 + '%';
                if (isMid) {
                    const label = document.createElement('span');
                    label.className = 'tick-label';
                    label.textContent = rangeMin + range / 2;
                    tick.appendChild(label);
                }
                ticks.appendChild(tick);
            }
        }

        function generateAllTargets() {
            const numbers = [];
            const availableNumbers = [];

            for (let i = rangeMin + 1; i < rangeMax; i++) {
                availableNumbers.push(i);
            }

            for (let i = availableNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableNumbers[i], availableNumbers[j]] = [availableNumbers[j], availableNumbers[i]];
            }

            for (let i = 0; i < TOTAL_TRIALS; i++) {
                numbers.push(availableNumbers[i % availableNumbers.length]);
            }

            return numbers;
        }

        function startGame(level) {
            currentLevel = level;
            setLevel(level);
            currentTrial = 1;
            score = 0;
            perfectScore = 0;
            hasClicked = false;
            targetNumbers = generateAllTargets();
            updateDisplay();
            levelSelect.classList.add('hidden');
            scoreDisplayContainer.style.display = 'block';
            gameContent.classList.remove('hidden');
            summary.classList.remove('visible');
            nextTrial();
        }

        function showLevelSelect() {
            levelSelect.classList.remove('hidden');
            scoreDisplayContainer.style.display = 'none';
            gameContent.classList.add('hidden');
            summary.classList.remove('visible');
        }

        function nextTrial() {
            targetNumber = targetNumbers[currentTrial - 1];
            targetDisplay.textContent = targetNumber;
            trialMonster = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
            targetMonster.textContent = trialMonster;
            hasClicked = false;
            aiming = false;
            aimPointerId = null;

            guessMarker.style.display = 'none';
            guessMarker.classList.remove('aiming');
            actualMarker.style.display = 'none';
            actualMarker.textContent = '';
            gapBar.style.display = 'none';
            feedback.innerHTML = '';
            feedback.className = 'feedback';
            nextBtn.classList.remove('visible');
            numberLine.classList.remove('disabled');
            lineZone.classList.remove('disabled', 'aiming');
            instructions.style.visibility = 'visible';
        }

        function valueAt(clientX) {
            const rect = numberLine.getBoundingClientRect();
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            return Math.round(rangeMin + percentage * (rangeMax - rangeMin));
        }

        function percentOf(value) {
            return ((value - rangeMin) / (rangeMax - rangeMin)) * 100;
        }

        // Finger down: a marker appears and follows the finger. Finger up: that
        // is the guess. Anywhere in the tall band counts.
        function aimAt(clientX) {
            guessMarker.style.left = percentOf(valueAt(clientX)) + '%';
        }

        lineZone.addEventListener('pointerdown', (event) => {
            if (hasClicked || aiming) return;
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            event.preventDefault();
            aiming = true;
            aimPointerId = event.pointerId;
            try { lineZone.setPointerCapture(event.pointerId); } catch (e) {}
            lineZone.classList.add('aiming');
            guessMarker.removeAttribute('data-value');
            guessMarker.classList.add('aiming');
            guessMarker.style.display = 'block';
            aimAt(event.clientX);
        });

        lineZone.addEventListener('pointermove', (event) => {
            if (!aiming || event.pointerId !== aimPointerId) return;
            aimAt(event.clientX);
        });

        lineZone.addEventListener('pointerup', (event) => {
            if (!aiming || event.pointerId !== aimPointerId) return;
            aiming = false;
            commitGuess(valueAt(event.clientX));
        });

        lineZone.addEventListener('pointercancel', () => {
            if (!aiming) return;
            aiming = false;
            lineZone.classList.remove('aiming');
            guessMarker.classList.remove('aiming');
            guessMarker.style.display = 'none';
        });

        // A tap that misses the band entirely still gets an answer: the band wiggles.
        gameContent.addEventListener('pointerdown', (event) => {
            if (hasClicked || lineZone.contains(event.target) || nextBtn.contains(event.target)) return;
            lineZone.classList.remove('nudge');
            void lineZone.offsetWidth;
            lineZone.classList.add('nudge');
        });
        lineZone.addEventListener('animationend', () => lineZone.classList.remove('nudge'));

        function commitGuess(guessValue) {
            if (hasClicked) return;
            hasClicked = true;
            numberLine.classList.add('disabled');
            lineZone.classList.add('disabled');
            lineZone.classList.remove('aiming');
            guessMarker.classList.remove('aiming');
            instructions.style.visibility = 'hidden';
            showResult(guessValue);
        }

        function showResult(guessValue) {
            const range = rangeMax - rangeMin;
            const guessPercentage = ((guessValue - rangeMin) / range) * 100;
            const actualPercentage = ((targetNumber - rangeMin) / range) * 100;

            guessMarker.style.left = guessPercentage + '%';
            guessMarker.style.display = 'block';
            guessMarker.setAttribute('data-value', 'Your guess: ' + guessValue);

            actualMarker.style.left = actualPercentage + '%';
            actualMarker.textContent = trialMonster;
            actualMarker.style.display = 'block';
            actualMarker.setAttribute('data-value', 'Monster: ' + targetNumber);

            const difference = Math.abs(guessValue - targetNumber);
            const isCorrect = difference <= accuracyMargin;

            // Bar from the guess to the monster: how far off, at a glance.
            gapBar.className = 'gap-bar ' + (isCorrect ? 'hit' : 'miss');
            gapBar.style.left = Math.min(guessPercentage, actualPercentage) + '%';
            gapBar.style.width = Math.abs(actualPercentage - guessPercentage) + '%';
            gapBar.style.display = difference === 0 ? 'none' : 'block';

            if (isCorrect) {
                score++;
                const randomMonster = trialMonster;
                feedback.className = 'feedback success';

                if (difference === 0) {
                    perfectScore++;
                    feedback.className = 'feedback success perfect';
                    feedback.innerHTML = `
                        <div class="feedback-icon">${randomMonster}</div>
                        <div class="feedback-message">PERFECT! You caught the monster exactly!</div>
                    `;
                    createConfetti(true);
                } else {
                    feedback.innerHTML = `
                        <div class="feedback-icon">${randomMonster}</div>
                        <div class="feedback-message">You caught the monster!</div>
                    `;
                    createConfetti(false);
                }
            } else {
                feedback.className = 'feedback fail';
                const arrow = targetNumber > guessValue ? '➡️' : '⬅️';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128168; ${arrow}</div>
                    <div class="feedback-message">It got away! You were ${difference} away.</div>
                `;
            }

            updateDisplay();

            if (currentTrial < TOTAL_TRIALS) {
                nextBtn.textContent = 'Next monster ➜';
                nextBtn.classList.add('visible');
            } else {
                nextBtn.textContent = 'See results 🏆';
                nextBtn.classList.add('visible');
            }
        }

        function updateDisplay() {
            currentTrialDisplay.textContent = currentTrial;
            scoreDisplay.textContent = score;
        }

        function createConfetti(isPerfect = false) {
            const container = document.createElement('div');
            container.className = 'confetti';
            document.body.appendChild(container);

            const colors = ['#6b21a8', '#581c87', '#27ae60', '#f1c40f', '#e74c3c', '#3498db'];
            const pieceCount = isPerfect ? 100 : 30;
            const duration = isPerfect ? 3000 : 2000;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                if (isPerfect) {
                    piece.classList.add('perfect');
                }
                piece.style.left = Math.random() * window.innerWidth + 'px';
                piece.style.top = Math.random() * 200 + 'px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * (isPerfect ? 1 : 0.5) + 's';
                container.appendChild(piece);
            }

            setTimeout(() => container.remove(), duration);
        }

        function showSummary() {
            gameContent.classList.add('hidden');
            summary.classList.add('visible');
            finalCorrect.textContent = score;
            finalIncorrect.textContent = TOTAL_TRIALS - score;
            finalPerfect.textContent = perfectScore;
            perfectStat.style.display = perfectScore > 0 ? 'block' : 'none';
        }


        nextBtn.addEventListener('click', () => {
            if (currentTrial >= TOTAL_TRIALS) {
                showSummary();
            } else {
                currentTrial++;
                updateDisplay();
                nextTrial();
            }
        });

        playAgainBtn.addEventListener('click', () => startGame(currentLevel));
        changeLevelBtn.addEventListener('click', showLevelSelect);

        // Read-only state for play-test tooling.
        window.__game = {
            get state() {
                return {
                    level: currentLevel, trial: currentTrial, score, perfectScore,
                    target: targetNumber, rangeMin, rangeMax, accuracyMargin,
                    hasClicked, aiming,
                    screen: summary.classList.contains('visible') ? 'summary'
                        : gameContent.classList.contains('hidden') ? 'levels' : 'play',
                };
            },
        };

        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const level = parseInt(btn.dataset.level);
                startGame(level);
            });
        });
    </script>
</body>
</html>
